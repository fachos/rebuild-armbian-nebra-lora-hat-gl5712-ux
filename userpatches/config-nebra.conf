# Armbian build configuration — Nebra LoRa on Radxa ROCK Pi 4B+
# Use:  cp userpatches/config-nebra.conf userpatches/  then  ./compile.sh nebra
# (a config named config-<x>.conf gives you the short command ./compile.sh <x>)

BOARD=rockpi-4bplus
BRANCH=current
RELEASE=trixie

BUILD_MINIMAL=no
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
EXPERT=yes
COMPRESS_OUTPUTIMAGE=sha,img,xz
